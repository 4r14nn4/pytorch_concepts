# =============================================================
# Post-hoc analysis of trained generative concept models.
#
#   python conceptarium/analysis/run_generative_analysis.py                 # every cbgm run
#   python conceptarium/analysis/run_generative_analysis.py all_jobs=false  # newest only
#   python conceptarium/analysis/run_generative_analysis.py job_dir=<hydra job dir>
#
# Runs from anywhere: the repo root as above, or from `conceptarium/` as
# `python analysis/run_generative_analysis.py` / `python -m analysis.run_generative_analysis`.
#
# Writes one results tree (see `results_dir`):
#   results.csv                              one row per run
#   results_by_model.csv                     mean/std over seeds
#   qualitative/<dataset>/<model>/<run>/     config.yaml + figures
#
# Metrics follow Ismail et al., ICLR 2024: `steerability` (Table 1) and
# `fid` (Table 2).
# =============================================================
hydra:
  mode: RUN
  job:
    name: generative_analysis
    chdir: false
  run:
    dir: "outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${hydra.job.name}"

# Explicit Hydra job directory to analyse -- a single path, or a list of them.
# When null, `search_dirs` is scanned instead.
job_dir: null

# Where to look for finished runs. Scanned recursively for job directories: a
# directory holding both `.hydra/config.yaml` and `checkpoints/*.ckpt`. Relative
# entries resolve against the directory you launched from.
#
# Deliberately NOT runs.csv. The registry stores absolute paths from whichever
# machine did the training and is not written at all under `debug: true`, so
# runs copied in from a GPU box -- the normal way results arrive -- are invisible
# to it while sitting in plain sight on disk.
#
# Three entries so the same config works from either launch directory:
# experiments launched from `conceptarium/` land in `conceptarium/outputs/`,
# results copied to the repo root land in `outputs/`, and whichever of these is
# the wrong guess simply does not exist. Overlapping entries are fine --
# discovery resolves and de-duplicates the paths it finds.
search_dirs:
  - outputs
  - ../outputs
  - conceptarium/outputs

# Applied to each run's own saved config, by dotted key. A run counts as finished
# when it has a checkpoint, which is both the truth and the only thing that makes
# it analysable.
filters:
  model.model_cls._target_: torch_concepts.nn.ConceptBottleneckGenerativeModel

# true (default): analyse every matching run -- what comparing a sweep needs.
# false: only the newest. Ignored when `job_dir` is given explicitly.
all_jobs: true

# Root of the results tree. Relative to the directory you launched from.
results_dir: results

seed: 42

# auto picks cuda when present, else cpu (never mps -- torchvision preprocessing
# and HuggingFace models misbehave there, so the backbone refuses it too).
#
# This is worth setting. The guide runs the image backbone live and torchvision
# resizes to 224x224, which on Color-MNIST is 64x the pixels of the original
# 28x28: a full 10k-image test pass measured ~440s on 8 CPU threads. On a GPU it
# is seconds. FID additionally runs Inception-v3 over `n_fid_samples` images.
accelerator: auto        # auto | cpu | cuda

# =============================================================
# Metrics
# =============================================================
# Which metrics to compute (key is `compute_metrics`, not `metrics`: that name is
# a Hydra config GROUP here, so an override would be read as a group swap).
# By their registry name in generative_utils.METRICS.
# null runs every registered metric. Adding a metric there makes it available
# here with no change to the script.
#
#   fid                 Frechet distance, generated vs real (paper Table 2)
#   steerability        does do(concept) put the concept in the output? (Table 1)
#   reconstruction_nll  the objective's own reconstruction term
#   concept_accuracy    the model's own ConceptMetrics on the test split
compute_metrics: null

# Samples per side of the FID estimate. The paper uses 40k; FID is biased upward
# at small sample counts, so compare runs at the SAME setting rather than against
# the published number.
n_fid_samples: 2048

# Prior draws the steerability metric starts from (the paper keeps 1000 that do
# not already show the concept, so this is an upper bound on that).
#
# NOTE: steerability is defined for BINARY concepts only -- "turn the concept on"
# has no single meaning for a k-way categorical one. Non-binary concepts are
# skipped with a warning, and a model with no binary concepts reports nan.
n_steering_samples: 1000

# The external judge: a classifier trained on REAL data, which decides whether a
# generated sample shows a concept. The paper requires >=98% test accuracy before
# the steerability number means anything; `classifier_accuracy` is reported in
# results.csv so you can check.
#
# `classifier_width` is the first conv stage; the net doubles it twice, so 16
# means 16/32/64 channels -- a few tens of thousands of parameters. It only has
# to answer "is this binary concept present", and it shares the GPU with the
# generative model, so it is kept deliberately small. Raise it (or
# `classifier_epochs`) if the accuracy falls short.
classifier_epochs: 5
classifier_lr: 1e-3
classifier_width: 16

# Rows per generative/classifier pass. Caps peak memory WITHOUT changing any
# result: generation, decoding and classification are all chunked at this size
# and concatenated, so `n_fid_samples` / `n_steering_samples` still decide how
# many samples are scored. Lower it if the analysis runs out of memory.
eval_batch_size: 128

# Cap the test-set passes (reconstruction_nll, concept_accuracy, and the judge's
# scoring) at this many batches; null scores the whole split.
max_eval_batches: null

# =============================================================
# Qualitative
# =============================================================
# Columns in overview.png (originals / reconstructions / generations).
n_samples: 10

# Concepts to steer, one figure each. null = every concept in the model.
# CelebA has 40, hence 40 figures -- pick a few:
#   steer_concepts="[Smiling,Male,Eyeglasses]"
steer_concepts: null

# NOTE: there is no `hard_sampling` key. Whether sampled concepts are quantised
# to a hard state before decoding follows from their declared distribution
# family, which the rebuilt model already carries from training -- so the decoder
# is always on the distribution it was trained on, with nothing to set here.
