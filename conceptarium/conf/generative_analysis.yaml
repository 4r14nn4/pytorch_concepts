# =============================================================
# Post-hoc analysis of a trained generative concept model.
#
#   cd conceptarium
#   python run_generative_analysis.py                 # EVERY cbgm run found
#   python run_generative_analysis.py all_jobs=false  # only the newest
#   python run_generative_analysis.py job_dir=outputs/multirun/.../0
#
# Produces, next to each job directory:
#   overview.png            original / reconstruction / generation
#   steering_<concept>.png  one generated sample, then that same sample
#                           at every state of that concept
#   generative_metrics.csv
#
# and, when more than one run was analysed, one combined
# generative_metrics_all.csv in this job's own output directory.
# =============================================================
hydra:
  mode: RUN
  job:
    name: generative_analysis
    chdir: false
  run:
    dir: "outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${hydra.job.name}"

# Explicit Hydra job directory to analyse -- a single path, or a list of them.
# When null, `search_dirs` is scanned instead.
job_dir: null

# Where to look for finished runs. Scanned recursively for job directories: a
# directory holding both `.hydra/config.yaml` and `checkpoints/*.ckpt`. Relative
# entries resolve against the directory you launched from.
#
# Deliberately NOT runs.csv. The registry stores absolute paths from whichever
# machine did the training and is not written at all under `debug: true`, so
# runs copied in from a GPU box -- the normal way results arrive -- are invisible
# to it while sitting in plain sight on disk. Both defaults below are listed
# because experiments launched from `conceptarium/` land in `conceptarium/
# outputs/`, while results copied to the repo root land in `outputs/`.
search_dirs:
  - outputs
  - ../outputs

# Applied to each run's own saved config, by dotted key. `status` is gone: a run
# counts as finished when it has a checkpoint, which is both the truth and the
# only thing that makes it analysable.
filters:
  model.model_cls._target_: torch_concepts.nn.ConceptBottleneckGenerativeModel

# true (default): analyse every matching run, writing a figure set into each job
# folder -- what comparing a sweep needs. false: only the newest. Ignored when
# `job_dir` is given explicitly.
all_jobs: true

seed: 42

# auto picks cuda when present, else cpu (never mps -- torchvision preprocessing
# and HuggingFace models misbehave there, so the backbone refuses it too).
#
# This is worth setting. The guide runs the image backbone live and torchvision
# resizes to 224x224, which on Color-MNIST is 64x the pixels of the original
# 28x28: a full 10k-image test pass measured ~440s on 8 CPU threads, ~60% of it
# inside the ResNet. On a GPU it is seconds.
accelerator: auto        # auto | cpu | cuda

# Cap the metric pass at this many batches; null scores the whole test split.
# Only the metrics are affected -- the figures are unconditional -- and
# `n_test_samples` in the output always says how many samples were scored. Set
# it when sweeping many runs on a CPU box, where the full pass dominates.
max_eval_batches: null

# Columns in overview.png (originals / reconstructions / generations).
n_samples: 10
# NOTE: there is no `hard_sampling` key. Whether sampled concepts are quantised
# to a hard state before decoding follows from their declared distribution
# family, which the rebuilt model already carries from training -- so the decoder
# is always on the distribution it was trained on, with nothing to set here.
# Concepts to steer, one figure each. null = every concept in the model.
steer_concepts: null
